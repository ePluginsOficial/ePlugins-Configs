    # Mensagens para o jogador que ganhou a recompensa
    Messages:
      actionbar: '&aParabéns, você coletou a recompensa!'
      title: '&a&lPARABÉNS<nl>&fvocê coletou a recompensa!'
      sound: 'LEVEL_UP'
