# Mensagens gerais do plugin

messages:
  syntax: '&cUse: /{command} {syntax}'
  permission: '&cVocê não tem permissão para isso.'
  reload: '&aConfiguração recarregada com sucesso!'
  console: '&cApenas jogadores in-game podem realizar esta ação.'
  target: '&cJogador &f{player} &cnão encontrado.'
  number: '&cO argumento não é um número.'
  changed: '&aTempo do jogador &f{player} &aalterado para &f{time}'
  added: '&aVocê adicionou &f{amount} &ade tempo ao jogador &f{player}&a. (Total: &f{time}&a)'
  removed: '&aVocê removeu &f{amount} &ade tempo do jogador &f{player}&a. (Total: &f{time}&a)'
  remove-exceeds: '&cVocê não pode remover &f{amount} &cde tempo do jogador &f{player}&c, ele possui apenas &f{time}&c.'
  reset: '&aVocê resetou o tempo do jogador &7{player}'
  no-permission: '&cVocê não pode coletar a recompensa do desafio &f{mission}#'
  mission-locked: '&cVocê precisa ficar online por &f{required} &cpara coletar a missão &f{mission}&c. (Falta: &f{remaining}&c)'
  mission-claimed: '&cVocê já coletou a recompensa do desafio &f{mission}&c.'
  player-time:
    - ''
    - '&aO jogador &7{player}&a está online há &8-> &f{time}'
    - '&aVisto por último: &7{data} às {hora}'
    - ''
