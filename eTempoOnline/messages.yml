    - ''
    - '&a&lTEMPO! &aVocê recebeu uma recompensa de tempo'
    - '&ause &e/tempo &apara recolher.'
    - ''
  help:
   - ''
   - '&aComandos disponíveis:'
   - ''
   - ' &8> &a/tempo &8- &7Abre seu menu de tempo.'
   - ' &8> &a/tempo <player> &8- &7Vé o tempo de um jogador.'
   - ' &8> &a/tempo top &8- &7Abre o menu de tops.'
   - ' &8> &a/tempo missoes &8- &7Abre o menu de missões.'
   - ' &8> &a/tempo help &8- &7Exibe esta mensagem.'
   - ''
  help-admin:
   - ''
   - '&aComandos disponíveis:'
   - ''
   - ' &8> &a/tempo &8- &7Abre seu menu de tempo.'
   - ' &8> &a/tempo <player> &8- &7Vé o tempo de um jogador.'
   - ' &8> &a/tempo set <player> <tempo> &8- &7Seta o tempo de um jogador (em segundos).'
   - ' &8> &a/tempo add <player> <tempo> &8- &7Adiciona tempo a um jogador (em segundos).'
   - ' &8> &a/tempo remove <player> <tempo> &8- &7Remove tempo de um jogador (em segundos).'
   - ' &8> &a/tempo reset <player> &8- &7Reseta o tempo de um jogador.'
   - ' &8> &a/tempo top &8- &7Abre o menu de tops.'
   - ' &8> &a/tempo missoes &8- &7Abre o menu de missões.'
   - ' &8> &a/tempo reload &8- &7Recarrega as configurações do plugin.'
   - ' &8> &a/tempo help &8- &7Exibe esta mensagem.'
   - ''
