rewards:
  reco1:
    # Item que será dado ao jogador.
    item:
      material: 'STONE'
      name: '&aPedra Mística'
      amount: 1
      lore:
        - '&aEu valho muito!'
      # ENCHANT:LEVEL
      # Caso não queira deixe:
      # Enchants: []
      enchants: []
    # Se a lista tiver ao menos um comando, executa os comandos.
    # Lista vazia = entrega o item acima.
    command:
      list:
        - 'give {player} stone 1'